<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>TempsPro – Planning</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--tx:#0f172a;--mut:#64748b;--bd:#e2e8f0;--ac:#4f46e5;--ok:#059669;--ko:#e11d48;--wa:#b45309;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mut:#94a3b8;--bd:#334155;--ac:#6366f1;--ok:#34d399;--ko:#fb7185;--wa:#fbbf24;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mut:#94a3b8;--bd:#334155;--ac:#6366f1;--ok:#34d399;--ko:#fb7185;--wa:#fbbf24;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
button,input,select{font:inherit;color:inherit}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.inp{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-top:3px}
.btn{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:9px 13px;cursor:pointer;font-weight:600}
.pri{background:var(--ac);color:#fff;border-color:var(--ac)}.dng{color:var(--ko)}.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.mut{color:var(--mut);font-size:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 14px}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--bd)}
nav button{white-space:nowrap;border:0;background:none;padding:8px 12px;border-radius:10px;font-weight:600;color:var(--mut);cursor:pointer}
nav button.on{background:var(--ac);color:#fff}
main{padding:14px;max-width:1200px;margin:auto}
.grid{display:grid;gap:10px}.k{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:14px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:820px}th,td{padding:7px;border-bottom:1px solid var(--bd);border-right:1px solid var(--bd);vertical-align:top;text-align:left}
th:first-child,td:first-child{position:sticky;left:0;background:var(--card);min-width:130px;z-index:1}
.chip{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:5px 7px;margin-bottom:4px;cursor:pointer;font-size:12px}
.chip.bad{border-color:var(--ko)}.chip.lv{border-style:dashed;color:var(--wa);cursor:default}
.add{width:100%;border:1px dashed var(--bd);background:none;border-radius:9px;color:var(--mut);padding:5px;cursor:pointer}
.bd{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd)}
#modal,#login{position:fixed;inset:0;background:rgba(2,6,23,.7);z-index:50;display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto}
#login{background:var(--bg)}#modal>div,#login>div{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;width:100%;max-width:400px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.pad button{padding:14px;font-size:18px}
.dots span{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--mut);margin:0 6px}.dots .f{background:var(--ac);border-color:var(--ac)}
canvas{width:100%;height:130px;background:var(--bg);border:1px solid var(--bd);border-radius:10px;touch-action:none}
.hide{display:none!important}
.tag{display:inline-flex;align-items:center;background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:5px 9px;font-size:13px}
@media print{header,nav,.np{display:none!important}body{background:#fff;color:#000}}
</style>
</head>
<body>
<div id="login"></div>
<div id="modal" class="hide"></div>
<header class="row sp np"><div><b id="ttl">TempsPro</b><div class="mut" id="who"></div></div><div class="row"><span class="bd mut" id="sync"></span><button class="btn" onclick="logout()">Quitter</button></div></header>
<nav id="nav" class="np"></nav>
<main id="view"></main>

<script>
const $=id=>document.getElementById(id);
const toast=m=>{const t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:99;max-width:90%;text-align:center';document.body.appendChild(t);setTimeout(()=>t.remove(),3200)};
let askCb;const ask=(m,cb)=>{askCb=cb;openM(`<b>${esc(m)}</b><div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" onclick="closeM()">Annuler</button><button class="btn dng" onclick="closeM();askCb()">Confirmer</button></div>`)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={emps:[],shifts:[],reqs:[],sigs:{},pub:{},cfg:{pin:'1234',coef:1.42,store:'Carrefour City Vidal',depts:['Caisse','Rayon','Réception','Boulangerie'],contracts:['CDI 35h','CDI 30h','CDD 35h','Étudiant 15h'],tpls:[]}};
// Listes « Poste » et « Contrat » modifiables par le manager (synchronisées avec les réglages)
const DEPTS=()=>S.cfg.depts,CONTRACTS=()=>S.cfg.contracts,LISTS={depts:'poste',contracts:'contrat'};
const opts=(list,cur,add)=>[...list,...(cur&&!list.includes(cur)?[cur]:[])].map(d=>`<option value="${esc(d)}"${d==cur?' selected':''}>${esc(d)}</option>`).join('')+(add?'<option value="__new">+ Ajouter…</option>':'');
function addItem(k,v){v=(v||'').trim();if(!v)return false;if(S.cfg[k].some(x=>x.toLowerCase()===v.toLowerCase()))return true;S.cfg[k]=[...S.cfg[k],v];return true}
// Reprise automatique des données enregistrées sous l'ancien nom (SkellPro)
const LSget=k=>{try{const v=localStorage.getItem('tempspro'+k);return v!==null?v:localStorage.getItem('skellpro'+k)}catch(e){return null}};
try{const l=JSON.parse(LSget('')||'null');if(l)S={...S,...l,cfg:{...S.cfg,...l.cfg}}}catch(e){}
let user=null,tab='plan',rl='m',pin='',empSel='',wk=mon(new Date()),filt='all';

/* ---------- dates ---------- */
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
function mon(d){d=new Date(d);d.setDate(d.getDate()-(d.getDay()+6)%7);d.setHours(0,0,0,0);return d}
const days=()=>[...Array(7)].map((_,i)=>{const d=new Date(wk);d.setDate(d.getDate()+i);return d});
const keys=()=>days().map(ymd),wkey=()=>ymd(wk);
const fd=s=>parse(s).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
const isoWeek=d=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));return Math.ceil(((t-new Date(Date.UTC(t.getUTCFullYear(),0,1)))/864e5+1)/7)};
const hh=t=>{const[h,m]=t.split(':').map(Number);return h+m/60};
const dur=s=>{const a=hh(s.a);let b=hh(s.b);if(b<=a)b+=24;return Math.max(0,b-a-(s.br||0)/60)};
const span=s=>{const a=hh(s.a);let b=hh(s.b);if(b<=a)b+=24;const st=parse(s.date).getTime()+a*36e5;return[st,st+(b-a)*36e5]};
const night=s=>{const a=hh(s.a);let b=hh(s.b);if(b<=a)b+=24;let n=0;for(let t=a;t<b;t+=.5){const h=t%24;if(h>=21||h<6)n+=.5}return n};
const f1=n=>n.toFixed(1).replace('.',',')+' h',eur=n=>n.toLocaleString('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const weekShifts=e=>S.shifts.filter(s=>keys().includes(s.date)&&(!e||s.emp===e));
const leave=(e,d)=>S.reqs.find(r=>r.emp===e&&r.st==='Approuvé'&&r.from<=d&&d<=r.to);

/* ---------- conformité (règles de l'appli d'origine : 10 h/jour, 11 h de repos, 48 h/semaine) ---------- */
function alerts(){const o=[];S.emps.forEach(e=>{const l=weekShifts(e.id).sort((x,y)=>span(x)[0]-span(y)[0]);const t=l.reduce((n,s)=>n+dur(s),0);
 if(t>48)o.push(`${e.name} : ${f1(t)} sur la semaine (max 48 h)`);
 l.forEach((s,i)=>{if(dur(s)>10)o.push(`${e.name} : ${f1(dur(s))} le ${fd(s.date)} (max 10 h)`);
  if(i&&(span(s)[0]-span(l[i-1])[1])/36e5<11)o.push(`${e.name} : moins de 11 h de repos avant le ${fd(s.date)}`);
  if(leave(e.id,s.date))o.push(`${e.name} : shift le ${fd(s.date)} pendant un congé approuvé`)})});return o}

/* ---------- stockage : local + synchro équipe (serveur Netlify) ---------- */
// ver = version serveur connue, base = dernier état synchronisé (pour fusionner en cas de modifications simultanées)
let ver=+(LSget('_v')||0),base=null,dirty=false,busy=false;
try{base=JSON.parse(LSget('_base')||'null')}catch(e){}
const setSync=t=>$('sync').textContent=t;
const keep=()=>{try{localStorage.setItem('tempspro',JSON.stringify(S));localStorage.setItem('tempspro_v',ver);localStorage.setItem('tempspro_base',JSON.stringify(base))}catch(e){}};
function save(){dirty=true;keep();render();push()}
// Fusion 3 voies : applique sur l'état distant uniquement ce que cet appareil a modifié depuis "base".
function mergeColl(b,l,r){const arr=Array.isArray(r)||Array.isArray(l),toM=x=>Array.isArray(x)?Object.fromEntries(x.map(o=>[o.id,o])):{...(x||{})};
 const B=toM(b),L=toM(l),R=toM(r),J=JSON.stringify;
 for(const k in L)if(J(L[k])!==J(B[k]))R[k]=L[k];for(const k in B)if(!(k in L))delete R[k];return arr?Object.values(R):R}
function merge(b,l,r){b=b||{};const o={...r};for(const k of ['emps','shifts','reqs','sigs','pub','cfg'])o[k]=mergeColl(b[k],l[k],r[k]);return o}
function adopt(json,v){const n=JSON.parse(json);S={...S,...n,cfg:{...S.cfg,...n.cfg}};base=JSON.parse(JSON.stringify(S));ver=v;keep();
 if(user&&$('modal').classList.contains('hide'))render();else if(!user)loginUI()}
async function push(){if(busy||!dirty)return;busy=true;setSync('Synchronisation…');
 try{for(let i=0;i<5&&dirty;i++){const j=JSON.stringify(S);
  const r=await fetch('/api/state',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({base:ver,json:j})});
  if(r.ok){ver=(await r.json()).v;base=JSON.parse(j);if(JSON.stringify(S)===j)dirty=false;keep();continue}
  if(r.status==409){const d=await r.json();const rem=JSON.parse(d.json);const m=merge(base,S,rem);S={...S,...m,cfg:{...S.cfg,...m.cfg}};base=rem;ver=d.v;keep();render();continue}
  throw new Error(r.status)}
  setSync(dirty?'En attente de synchro':'Synchronisé')}catch(e){setSync('Hors ligne – réessai…')}finally{busy=false}}
async function pull(){if(busy)return;if(dirty)return push();
 try{const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw 0;const d=await r.json();
  if(!d.json){if(S.emps.length){dirty=true;ver=0;push()}else setSync('Synchronisé');return}
  if(d.v!==ver)adopt(d.json,d.v);setSync('Synchronisé')}catch(e){setSync('Hors ligne – réessai…')}}
pull();setInterval(pull,5000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
window.addEventListener('online',pull);

/* ---------- connexion ---------- */
function loginUI(){if(!S.emps.some(e=>e.id===empSel))empSel=S.emps[0]?.id||'';const o=S.emps.map(e=>`<option value="${esc(e.id)}"${e.id===empSel?' selected':''}>${esc(e.name)}</option>`).join('');
 $('login').innerHTML=`<div style="text-align:center"><h2 style="margin:0">Temps<span style="color:var(--ac)">Pro</span></h2><div class="mut">${esc(S.cfg.store)}</div>
 <div class="row" style="margin:14px 0;justify-content:center"><button class="btn ${rl=='m'?'pri':''}" onclick="rl='m';pin='';loginUI()">Manager</button><button class="btn ${rl=='e'?'pri':''}" onclick="rl='e';pin='';loginUI()">Salarié</button></div>
 ${rl=='e'?(S.emps.length?`<select class="inp" onchange="empSel=this.value;pin=''">${o}</select>`:'<div class="mut">Aucun salarié : le manager doit d\'abord les créer.</div>'):''}
 <div class="dots" style="margin:14px 0">${[0,1,2,3].map(i=>`<span class="${i<pin.length?'f':''}"></span>`).join('')}</div><div id="perr" class="dng mut" style="min-height:18px"></div>
 <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="btn" onclick="key('${n}')">${n}</button>`).join('')}<button class="btn" onclick="pin=pin.slice(0,-1);loginUI()">⌫</button><button class="btn" onclick="key('0')">0</button><button class="btn ok" onclick="tryLogin()">OK</button></div></div>`;
 if(!empSel&&S.emps[0])empSel=S.emps[0].id}
function key(n){if(pin.length<4){pin+=n;loginUI();if(pin.length==4)setTimeout(tryLogin,120)}}
function tryLogin(){let ok=false;
 if(rl=='m'){ok=pin===S.cfg.pin;if(ok)user='m'}else{const e=S.emps.find(x=>x.id===(empSel||S.emps[0]?.id));ok=!!e&&pin===e.pin;if(ok)user=e.id}
 if(!ok){pin='';loginUI();$('perr').textContent='Code incorrect';return}
 pin='';tab=user=='m'?'plan':'me';$('login').classList.add('hide');render()}
function logout(){user=null;pin='';$('login').classList.remove('hide');loginUI()}
document.addEventListener('keydown',e=>{if(user||$('login').classList.contains('hide'))return;if(/^\d$/.test(e.key))key(e.key);else if(e.key=='Backspace'){pin=pin.slice(0,-1);loginUI()}});

/* ---------- navigation & rendu ---------- */
const TABS={m:[['plan','Planning'],['team','Équipe'],['req','Congés'],['sig','Émargements'],['set','Réglages']],e:[['me','Mon planning']]};
function go(t){tab=t;render()}
function weekBar(){const d=days();return`<div class="row sp np" style="margin-bottom:10px"><div class="row"><button class="btn" onclick="wk.setDate(wk.getDate()-7);render()">◀</button><b>Semaine ${isoWeek(wk)} · ${fd(ymd(d[0]))} – ${fd(ymd(d[6]))}</b><button class="btn" onclick="wk.setDate(wk.getDate()+7);render()">▶</button><button class="btn" onclick="wk=mon(new Date());render()">Aujourd'hui</button></div>`}
function render(){if(!user)return;const m=user=='m',me=S.emps.find(e=>e.id===user);
 if(!m&&!me){logout();return}
 $('ttl').textContent='TempsPro · '+S.cfg.store;$('who').textContent=m?'Manager':me.name+' · '+me.dept;
 $('nav').innerHTML=TABS[m?'m':'e'].map(([k,l])=>`<button class="${tab==k?'on':''}" onclick="go('${k}')">${l}${k=='req'&&S.reqs.some(r=>r.st=='En attente')?' •':''}</button>`).join('');
 $('view').innerHTML={plan:vPlan,team:vTeam,req:vReq,sig:vSig,set:vSet,me:vMe}[tab]();
 if(tab=='me')initCanvas()}

function vPlan(){const al=alerts(),all=weekShifts();let h=0,c=0,sp=0;const E=S.emps.filter(e=>filt=='all'||e.dept==filt);const pub=S.pub[wkey()];
 const rows=E.map(e=>{let t=0;const cells=days().map(d=>{const k=ymd(d),l=leave(e.id,k);const ss=S.shifts.filter(s=>s.emp===e.id&&s.date===k);
  return`<td>${l?`<div class="chip lv">${esc(l.type)}</div>`:''}${ss.map(s=>{t+=dur(s);if(d.getDay()==0||night(s)>0)sp+=dur(s);return`<button class="chip ${dur(s)>10?'bad':''}" onclick="shiftForm('${s.id}')"><b>${s.a}–${s.b}</b> · ${f1(dur(s))}<br><span class="mut">${esc(s.dept)}${s.br?' · P '+s.br+'m':''}${s.note?' · '+esc(s.note):''}</span></button>`}).join('')}<button class="add np" onclick="shiftForm('','${e.id}','${k}')">+</button></td>`}).join('');
  h+=t;c+=t*e.rate*S.cfg.coef;return`<tr><td><b>${esc(e.name)}</b><div class="mut">${esc(e.contract)} · ${esc(e.dept)}</div></td>${cells}<td><b>${f1(t)}</b><div class="mut">${eur(t*e.rate*S.cfg.coef)}</div></td></tr>`}).join('');
 return weekBar()+`<div class="row"><select class="inp" style="width:auto" onchange="filt=this.value;render()"><option value="all">Tous secteurs</option>${opts(DEPTS(),filt=='all'?'':filt)}</select>
 <button class="btn pri" onclick="shiftForm()">+ Shift</button><button class="btn ${pub?'':'ok'}" onclick="S.pub['${wkey()}']=!S.pub['${wkey()}'];save()">${pub?'Dépublier':'Publier'}</button><button class="btn" onclick="exportCSV()">CSV</button><button class="btn" onclick="window.print()">Imprimer</button><button class="btn dng np" onclick="resetWeek()">Réinitialiser</button></div></div>
 <div class="mut" style="margin-bottom:8px">Statut : <b>${pub?'Publié (visible des salariés)':'Brouillon (invisible des salariés)'}</b></div>
 <div class="grid k" style="margin-bottom:10px"><div class="card"><div class="mut">Heures</div><b>${f1(h)}</b></div><div class="card"><div class="mut">Coût estimé (coef. ${S.cfg.coef})</div><b>${eur(c)}</b></div><div class="card"><div class="mut">Nuit / dimanche</div><b>${f1(sp)}</b></div><div class="card"><div class="mut">Alertes</div><b class="${al.length?'dng':''}">${al.length}</b></div></div>
 ${al.length?`<div class="card dng" style="margin-bottom:10px"><b>Points à vérifier</b><ul style="margin:6px 0 0;padding-left:18px">${al.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></div>`:''}
 ${S.emps.length?`<div class="tw"><table><thead><tr><th>Salarié</th>${days().map(d=>`<th>${fd(ymd(d))}</th>`).join('')}<th>Total</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="card">Aucun salarié. Ouvrez l\'onglet <b>Équipe</b> pour les ajouter.</div>'}`}

function vTeam(){return`<div class="row sp" style="margin-bottom:10px"><b>Équipe</b><button class="btn pri" onclick="empForm()">+ Salarié</button></div><div class="grid g2">${S.emps.map(e=>`<div class="card"><b>${esc(e.name)}</b><div class="mut">${esc(e.dept)} · ${esc(e.contract)} · ${e.rate.toFixed(2)} €/h</div><div style="margin:6px 0">Semaine : <b>${f1(weekShifts(e.id).reduce((n,s)=>n+dur(s),0))}</b> / ${e.hours} h</div><div class="row"><button class="btn" onclick="empForm('${e.id}')">Modifier</button><button class="btn dng" onclick="delEmp('${e.id}')">Supprimer</button></div></div>`).join('')||'<div class="card">Aucun salarié.</div>'}</div>`}

function vReq(){const nm=id=>esc(S.emps.find(e=>e.id===id)?.name||'Salarié supprimé');
 return`<b>Congés et indisponibilités</b><div class="grid g2" style="margin-top:10px">${[...S.reqs].reverse().map(r=>`<div class="card"><div class="row sp"><b>${nm(r.emp)}</b><span class="bd">${esc(r.st)}</span></div><div>${esc(r.type)} · du ${r.from} au ${r.to}</div>${r.why?`<div class="mut">${esc(r.why)}</div>`:''}${r.st=='En attente'?`<div class="row" style="margin-top:8px"><button class="btn ok" onclick="setReq('${r.id}','Approuvé')">Approuver</button><button class="btn dng" onclick="setReq('${r.id}','Refusé')">Refuser</button></div>`:''}</div>`).join('')||'<div class="card">Aucune demande.</div>'}</div>`}
function setReq(id,st){const r=S.reqs.find(x=>x.id===id);if(r){r.st=st;save()}}

function vSig(){return weekBar()+`</div><div class="grid g2">${S.emps.map(e=>{const s=S.sigs[wkey()+'|'+e.id];return`<div class="card"><div class="row sp"><b>${esc(e.name)}</b><span class="bd">${s?'Signé':'En attente'}</span></div>${s?`<img src="${s.img}" alt="Signature" style="height:70px;background:#fff;border-radius:8px;margin-top:6px"><div class="mut">${esc(s.ts)}</div>`:'<div class="mut" style="margin-top:6px">Aucune signature</div>'}</div>`}).join('')}</div><button class="btn np" style="margin-top:10px" onclick="window.print()">Imprimer</button>`}

function vSet(){return`<div class="card" style="max-width:480px"><b>Réglages</b><label class="mut"><br>Nom du magasin<input class="inp" id="cs" value="${esc(S.cfg.store)}"></label><label class="mut"><br>Coefficient coût employeur (charges incluses)<input class="inp" id="cc" type="number" step="0.01" min="1" value="${S.cfg.coef}"></label><div class="mut">Valeur reprise de l'appli d'origine (1,42) : à confirmer avec votre comptable.</div><label class="mut"><br>Nouveau PIN manager (4 chiffres, vide = inchangé)<input class="inp" id="cp" maxlength="4" inputmode="numeric" pattern="[0-9]{4}"></label><br><button class="btn pri" onclick="saveSet()">Enregistrer</button></div>`+vTpl()+listCard('depts','Postes')+listCard('contracts','Contrats')}
function listCard(k,t){return`<div class="card" style="max-width:480px;margin-top:10px"><b>${t}</b><div class="mut">Valeurs proposées dans le menu déroulant « ${LISTS[k][0].toUpperCase()+LISTS[k].slice(1)} ».</div><div class="row" style="flex-wrap:wrap;gap:6px;margin:8px 0">${S.cfg[k].map((v,i)=>`<span class="tag">${esc(v)} <a href="#" title="Retirer" onclick="delItem('${k}',${i});return false" style="color:inherit;text-decoration:none;margin-left:4px">✕</a></span>`).join('')||'<span class="mut">Aucune valeur.</span>'}</div><div class="row"><input class="inp" id="add_${k}" placeholder="Nouveau ${LISTS[k]}" style="flex:1" onkeydown="if(event.key==='Enter')addFromSet('${k}')"><button class="btn pri" onclick="addFromSet('${k}')">Ajouter</button></div></div>`}
function vTpl(){const T=S.cfg.tpls||[];return`<div class="card" style="max-width:480px;margin-top:10px"><b>Shifts pré-enregistrés</b><div class="mut">Horaires types à choisir en un clic quand vous ajoutez un shift.</div>
 <div style="margin:8px 0">${T.map(t=>`<div class="row sp" style="margin-bottom:6px"><span class="tag"><b>${esc(t.name)}</b>&nbsp;· ${esc(t.a)}–${esc(t.b)}${t.br?' · P '+t.br+'m':''}</span><button class="btn dng" onclick="delTpl('${esc(t.id)}')">Supprimer</button></div>`).join('')||'<span class="mut">Aucun modèle.</span>'}</div>
 <label class="mut">Nom du modèle<input class="inp" id="tn" placeholder="Ex. : Matin" maxlength="30"></label>
 <div class="row" style="margin-top:8px"><label class="mut" style="flex:1">Début<input class="inp" type="time" id="ta" value="08:00"></label><label class="mut" style="flex:1">Fin<input class="inp" type="time" id="tb" value="16:00"></label><label class="mut" style="flex:1">Pause (min)<input class="inp" type="number" min="0" step="5" id="tr" value="30"></label></div>
 <button class="btn pri" style="margin-top:10px" onclick="addTpl()">Ajouter le modèle</button></div>`}
function addTpl(){const n=$('tn').value.trim(),a=$('ta').value,b=$('tb').value,br=Math.max(0,parseInt($('tr').value)||0);
 if(!n)return toast('Donnez un nom au modèle.');if(!a||!b)return toast('Renseignez les horaires.');if(a===b)return toast('Le début et la fin doivent être différents.');
 const T=S.cfg.tpls||[];if(T.some(t=>t.name.toLowerCase()===n.toLowerCase()))return toast('Un modèle porte déjà ce nom.');
 S.cfg.tpls=[...T,{id:'t'+Date.now(),name:n,a,b,br}];save();toast('Modèle ajouté.')}
function delTpl(id){const t=(S.cfg.tpls||[]).find(x=>x.id===id);if(!t)return;ask(`Supprimer le modèle « ${t.name} » ? Les shifts déjà planifiés ne changent pas.`,()=>{S.cfg.tpls=S.cfg.tpls.filter(x=>x.id!==id);save();toast('Modèle supprimé.')})}
function applyTpl(id){const t=(S.cfg.tpls||[]).find(x=>x.id===id);if(!t)return;$('fa').value=t.a;$('fb').value=t.b;$('fr').value=t.br||0}
function resetWeek(){const k=keys(),n=S.shifts.filter(s=>k.includes(s.date)).length,sg=Object.keys(S.sigs).filter(x=>x.startsWith(wkey()+'|')).length;
 if(!n&&!S.pub[wkey()]&&!sg)return toast('Cette semaine est déjà vide.');
 ask(`Réinitialiser la semaine ${isoWeek(wk)} ? ${n} shift(s) seront supprimés${sg?`, ${sg} signature(s) effacée(s)`:''} et le planning repassera en brouillon. Les congés ne sont pas touchés.`,()=>{
  S.shifts=S.shifts.filter(s=>!k.includes(s.date));Object.keys(S.sigs).forEach(x=>{if(x.startsWith(wkey()+'|'))delete S.sigs[x]});delete S.pub[wkey()];save();toast('Semaine réinitialisée.')})}
function addFromSet(k){const v=$('add_'+k).value.trim();if(!v)return toast('Saisissez une valeur.');if(S.cfg[k].some(x=>x.toLowerCase()===v.toLowerCase()))return toast('Cette valeur existe déjà.');addItem(k,v);save();toast('Ajouté.')}
function delItem(k,i){const v=S.cfg[k][i];if(v==null)return;if(S.cfg[k].length<2)return toast('Gardez au moins une valeur.');const n=S.emps.filter(e=>(k=='depts'?e.dept:e.contract)===v).length;
 ask(`Retirer « ${v} » de la liste ?${n?` ${n} salarié(s) le conservent jusqu'à modification.`:''}`,()=>{S.cfg[k]=S.cfg[k].filter((_,j)=>j!==i);save();toast('Retiré.')})}
function saveSet(){const p=$('cp').value.trim();if(p&&!/^\d{4}$/.test(p))return toast('Le PIN doit contenir 4 chiffres.');
 S.cfg.store=$('cs').value.trim()||S.cfg.store;S.cfg.coef=parseFloat($('cc').value)||1.42;if(p)S.cfg.pin=p;save();toast('Enregistré.')}

function vMe(){const e=S.emps.find(x=>x.id===user),pub=S.pub[wkey()],sg=S.sigs[wkey()+'|'+e.id],ss=weekShifts(e.id);
 const mine=[...S.reqs].reverse().filter(r=>r.emp===e.id);
 return weekBar()+`</div>`+(!pub?`<div class="card">Le planning de cette semaine n'est pas encore publié.</div>`:`
 <div class="card" style="margin-bottom:10px"><b>Total prévu : ${f1(ss.reduce((n,s)=>n+dur(s),0))}</b></div>
 <div class="grid g2">${days().map(d=>{const k=ymd(d),l=leave(e.id,k),x=ss.filter(s=>s.date===k);return`<div class="card"><b>${fd(k)}</b>${l?`<div class="chip lv">${esc(l.type)}</div>`:''}${x.map(s=>`<div class="chip"><b>${s.a}–${s.b}</b> · ${f1(dur(s))}<br><span class="mut">${esc(s.dept)}${s.note?' · '+esc(s.note):''}</span></div>`).join('')||(l?'':'<div class="mut">Repos</div>')}</div>`}).join('')}</div>
 <div class="card" style="margin-top:10px"><b>Émargement</b>${sg?`<div class="mut">Signé le ${esc(sg.ts)}</div><img src="${sg.img}" alt="Signature" style="height:70px;background:#fff;border-radius:8px">`:`<div class="mut">En signant, vous certifiez l'exactitude des horaires.</div><canvas id="cv" style="margin:8px 0"></canvas><div class="row"><button class="btn" onclick="clr()">Effacer</button><button class="ok btn" onclick="sign()">Signer</button></div>`}</div>`)+
 `<div class="card" style="margin-top:10px"><b>Demande de congé / indisponibilité</b><div class="grid g2"><label class="mut">Type<select class="inp" id="rt"><option>Congé Payé</option><option>Indisponibilité</option><option>Repos Compensateur</option><option>Maladie</option></select></label><label class="mut">Du<input class="inp" type="date" id="rf"></label><label class="mut">Au<input class="inp" type="date" id="rto"></label><label class="mut">Motif<input class="inp" id="rw"></label></div><button class="btn pri" style="margin-top:8px" onclick="sendReq()">Envoyer</button>
 <div style="margin-top:10px">${mine.map(r=>`<div class="row sp mut"><span>${esc(r.type)} · ${r.from} → ${r.to}</span><span class="bd">${esc(r.st)}</span></div>`).join('')}</div></div>`}
function sendReq(){const f=$('rf').value,t=$('rto').value;if(!f||!t||t<f)return toast('Vérifiez les dates.');
 S.reqs.push({id:'r'+Date.now(),emp:user,type:$('rt').value,from:f,to:t,why:$('rw').value,st:'En attente'});save()}

/* ---------- signature ---------- */
let cv,cx,dr=false;
function initCanvas(){cv=$('cv');if(!cv)return;const r=cv.getBoundingClientRect(),q=window.devicePixelRatio||1;cv.width=r.width*q;cv.height=r.height*q;cx=cv.getContext('2d');cx.scale(q,q);cx.lineWidth=2.5;cx.lineCap='round';cx.strokeStyle='#4f46e5';
 const p=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
 cv.onpointerdown=e=>{dr=true;cv.setPointerCapture(e.pointerId);cx.beginPath();cx.moveTo(...p(e))};
 cv.onpointermove=e=>{if(dr){cx.lineTo(...p(e));cx.stroke()}};cv.onpointerup=cv.onpointercancel=()=>dr=false}
function clr(){if(cx)cx.clearRect(0,0,cv.width,cv.height)}
function sign(){const b=cx.getImageData(0,0,cv.width,cv.height).data;if(!b.some((v,i)=>i%4==3&&v))return toast('Dessinez votre signature.');
 const t=document.createElement('canvas');t.width=300;t.height=100;t.getContext('2d').drawImage(cv,0,0,300,100);
 S.sigs[wkey()+'|'+user]={ts:new Date().toLocaleString('fr-FR'),img:t.toDataURL('image/png')};save()}

/* ---------- formulaires ---------- */
const openM=h=>{$('modal').innerHTML=`<div>${h}</div>`;$('modal').classList.remove('hide')},closeM=()=>$('modal').classList.add('hide');
function shiftForm(id,emp,date){const s=S.shifts.find(x=>x.id===id)||{emp:emp||S.emps[0]?.id,date:date||ymd(days()[0]),a:'08:00',b:'16:00',br:30,dept:S.emps.find(e=>e.id===(emp||S.emps[0]?.id))?.dept||'Caisse',note:''};
 if(!S.emps.length)return toast('Ajoutez d\'abord un salarié dans l\'onglet Équipe.');
 openM(`<b>${id?'Modifier':'Ajouter'} un shift</b><input type="hidden" id="fi" value="${id||''}">
 ${(S.cfg.tpls||[]).length?`<label class="mut"><br>Shift pré-enregistré<select class="inp" id="ft" onchange="applyTpl(this.value)"><option value="">— Choisir un modèle —</option>${S.cfg.tpls.map(t=>`<option value="${esc(t.id)}">${esc(t.name)} (${esc(t.a)}–${esc(t.b)}${t.br?', P '+t.br+'m':''})</option>`).join('')}</select></label>`:`<div class="mut" style="margin-top:6px">Astuce : créez des shifts pré-enregistrés dans Réglages.</div>`}
 <label class="mut"><br>Salarié<select class="inp" id="fe">${S.emps.map(e=>`<option value="${e.id}"${e.id==s.emp?' selected':''}>${esc(e.name)}</option>`).join('')}</select></label>
 <label class="mut"><br>Jour<select class="inp" id="fd">${days().map(d=>`<option value="${ymd(d)}"${ymd(d)==s.date?' selected':''}>${fd(ymd(d))}</option>`).join('')}</select></label>
 <div class="row" style="margin-top:8px"><label class="mut" style="flex:1">Début<input class="inp" type="time" id="fa" value="${s.a}"></label><label class="mut" style="flex:1">Fin<input class="inp" type="time" id="fb" value="${s.b}"></label></div>
 <div class="row" style="margin-top:8px"><label class="mut" style="flex:1">Pause (min)<input class="inp" type="number" min="0" step="5" id="fr" value="${s.br}"></label><label class="mut" style="flex:1">Secteur<select class="inp" id="fp">${opts(DEPTS(),s.dept)}</select></label></div>
 <label class="mut"><br>Note<input class="inp" id="fn" value="${esc(s.note)}"></label>
 <div class="row sp" style="margin-top:14px">${id?`<button class="btn dng" onclick="delShift('${id}')">Supprimer</button>`:'<span></span>'}<div class="row"><button class="btn" onclick="closeM()">Annuler</button><button class="btn pri" onclick="saveShift()">Enregistrer</button></div></div>`)}
function saveShift(){const id=$('fi').value,o={id:id||'s'+Date.now(),emp:$('fe').value,date:$('fd').value,a:$('fa').value,b:$('fb').value,br:parseInt($('fr').value)||0,dept:$('fp').value,note:$('fn').value.trim()};
 if(!o.a||!o.b)return toast('Renseignez les horaires.');if(o.a===o.b)return toast('Le début et la fin doivent être différents.');const i=S.shifts.findIndex(x=>x.id===id);if(i>=0)S.shifts[i]=o;else S.shifts.push(o);closeM();save()}
function delShift(id){S.shifts=S.shifts.filter(s=>s.id!==id);closeM();save()}
function empForm(id){const e=S.emps.find(x=>x.id===id)||{name:'',dept:DEPTS()[0]||'',contract:CONTRACTS()[0]||'',hours:35,rate:'',pin:''};
 openM(`<b>${id?'Modifier':'Nouveau'} salarié</b><input type="hidden" id="ei" value="${id||''}">
 <label class="mut"><br>Nom Prénom<input class="inp" id="en" value="${esc(e.name)}"></label>
 <div class="row" style="margin-top:8px"><label class="mut" style="flex:1">Poste<div class="row" style="gap:4px"><select class="inp" id="ed" style="flex:1" onchange="newOpt(this,'edn')">${opts(DEPTS(),e.dept,1)}</select><button type="button" class="btn" id="edx" title="Supprimer ce poste de la liste" onclick="delOpt('ed','edn','depts')">🗑</button></div><input class="inp hide" id="edn" placeholder="Nouveau poste" style="margin-top:6px"></label><label class="mut" style="flex:1">Contrat<div class="row" style="gap:4px"><select class="inp" id="ec" style="flex:1" onchange="newOpt(this,'ecn')">${opts(CONTRACTS(),e.contract,1)}</select><button type="button" class="btn" id="ecx" title="Supprimer ce contrat de la liste" onclick="delOpt('ec','ecn','contracts')">🗑</button></div><input class="inp hide" id="ecn" placeholder="Nouveau contrat" style="margin-top:6px"></label></div>
 <div class="row" style="margin-top:8px"><label class="mut" style="flex:1">Heures/sem.<input class="inp" type="number" step="0.5" min="1" id="eh" value="${e.hours}"></label><label class="mut" style="flex:1">Taux horaire (€/h)<input class="inp" type="number" step="0.01" min="0" id="er" value="${e.rate}"></label></div>
 <label class="mut"><br>PIN du salarié (4 chiffres)<input class="inp" id="ep" maxlength="4" inputmode="numeric" value="${esc(e.pin)}"></label>
 <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" onclick="closeM()">Annuler</button><button class="btn pri" onclick="saveEmp()">Enregistrer</button></div>`)}
function delOpt(sel,inp,k){const el=$(sel),b=$(sel+'x'),v=el.value;if(v==='__new'){el.value=S.cfg[k][0]||'';newOpt(el,inp);return}
 if(!S.cfg[k].includes(v))return toast('Cette valeur ne fait pas partie de la liste.');if(S.cfg[k].length<2)return toast('Gardez au moins une valeur.');
 if(b.dataset.v!==v){b.dataset.v=v;b.textContent='Confirmer ?';b.classList.add('dng');clearTimeout(b._t);b._t=setTimeout(()=>{delete b.dataset.v;b.textContent='🗑';b.classList.remove('dng')},4000);return}
 clearTimeout(b._t);delete b.dataset.v;b.textContent='🗑';b.classList.remove('dng');
 S.cfg[k]=S.cfg[k].filter(x=>x!==v);el.innerHTML=opts(S.cfg[k],'',1);el.value=S.cfg[k][0];newOpt(el,inp);save();toast(`« ${v} » retiré de la liste.`)}
function newOpt(sel,inp){const b=$(sel+'x');if(b&&b.dataset.v){clearTimeout(b._t);delete b.dataset.v;b.textContent='🗑';b.classList.remove('dng')}const n=$(inp);n.classList.toggle('hide',sel.value!=='__new');if(sel.value==='__new')n.focus()}
function pick(sel,inp,k){if($(sel).value!=='__new')return $(sel).value;const v=$(inp).value.trim();return addItem(k,v)?S.cfg[k].find(x=>x.toLowerCase()===v.toLowerCase()):''}
function saveEmp(){if([['ed','edn'],['ec','ecn']].some(([a,b])=>$(a).value==='__new'&&!$(b).value.trim()))return toast('Saisissez le nouveau poste ou contrat.');
 const id=$('ei').value,o={id:id||'e'+Date.now(),name:$('en').value.trim(),dept:'',contract:'',hours:parseFloat($('eh').value)||0,rate:parseFloat($('er').value),pin:$('ep').value.trim()};
 if(!o.name||isNaN(o.rate))return toast('Nom et taux horaire obligatoires.');if(!/^\d{4}$/.test(o.pin))return toast('Le PIN doit contenir exactement 4 chiffres.');
 o.dept=pick('ed','edn','depts');o.contract=pick('ec','ecn','contracts');
 const i=S.emps.findIndex(x=>x.id===id);if(i>=0)S.emps[i]=o;else S.emps.push(o);closeM();save()}
function delEmp(id){const e=S.emps.find(x=>x.id===id);if(!e)return;ask(`Supprimer ${e.name} et tous ses shifts, demandes et signatures ?`,()=>{
 S.emps=S.emps.filter(x=>x.id!==id);S.shifts=S.shifts.filter(s=>s.emp!==id);S.reqs=S.reqs.filter(r=>r.emp!==id);Object.keys(S.sigs).forEach(k=>{if(k.endsWith('|'+id))delete S.sigs[k]});save();toast('Salarié supprimé.')})}

/* ---------- export ---------- */
async function exportCSV(){const q=v=>'"'+String(v).replace(/"/g,'""')+'"';let c='Salarié;Secteur;Date;Début;Fin;Pause (min);Durée (h);Note\n';
 weekShifts().sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>{const e=S.emps.find(x=>x.id===s.emp);c+=[q(e?.name||''),q(s.dept),s.date,s.a,s.b,s.br,dur(s).toFixed(2).replace('.',','),q(s.note)].join(';')+'\n'});
 const name=`Planning_${wkey()}.csv`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+c],{type:'text/csv'}));a.download=name;a.click()}

loginUI();
</script>
</body>
</html>
